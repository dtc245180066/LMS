# ==============================================================================
# VÙNG NHỚ GIỚI HẠN TẦN SUẤT TRUY CẬP (RATE LIMITING) - CHỐNG BRUTE-FORCE
# ==============================================================================
# Giới hạn mỗi địa chỉ IP tối đa 5 requests/phút vào endpoint đăng nhập
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

# ==============================================================================
# KHỐI 1: CHUYỂN HƯỚNG BẮT BUỘC HTTP (80) -> HTTPS (443)
# ==============================================================================
server {
    listen 80;
    server_name lms.vn;

    # Ghi nhận log truy cập và lỗi ra file cho Promtail / Loki
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Ẩn phiên bản Nginx để bảo mật thông tin hệ thống
    server_tokens off;

    # HTTP 301 Redirect sang HTTPS
    return 301 https://$host$request_uri;
}

# ==============================================================================
# KHỐI 2: MÁY CHỦ BẢO MẬT HTTPS (443) - REVERSE PROXY
# ==============================================================================
server {
    listen 443 ssl;
    server_name lms.vn;

    # Ghi nhận log truy cập và lỗi ra file cho Promtail / Loki
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Đường dẫn cặp chứng chỉ số tự ký (RSA 2048-bit)
    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # Giới hạn giao thức an toàn TLSv1.2 và TLSv1.3 với cipher suite mạnh
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # BỘ SECURITY HEADERS TIÊU CHUẨN (ÁP DỤNG ALWAYS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # Cho phép upload tài liệu bài giảng tối đa 50MB
    client_max_body_size 50M;

    # BIỆN PHÁP NGĂN CHẶN: RATE LIMITING CHỐNG TẤN CÔNG DÒ MẬT KHẨU (BRUTE-FORCE)
    # Áp dụng cho cả form /auth/login và API /api/auth/login
    location ~* ^/(auth|api/auth)/login$ {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển tiếp (Reverse Proxy) vào ứng dụng Web Node.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}