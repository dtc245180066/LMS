# ==============================================================================
# KHỐI 1: CHUYỂN HƯỚNG BẮT BUỘC HTTP (80) -> HTTPS (443)
# ==============================================================================
server {
    listen 80;
    server_name lms.vn;

    # Ẩn phiên bản Nginx để bảo mật thông tin hệ thống
    server_tokens off;

    # HTTP 301 Redirect sang HTTPS
    return 301 https://$host$request_uri;
}

# ==============================================================================
# KHỐI 2: MÁY CHỦ BẢO MẬT HTTPS (443) - REVERSE PROXY
# ==============================================================================
server {
    listen 443 ssl;
    server_name lms.vn;

    # Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Đường dẫn cặp chứng chỉ số tự ký (RSA 2048-bit)
    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # Giới hạn giao thức an toàn TLSv1.2 và TLSv1.3 với cipher suite mạnh
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # BỘ SECURITY HEADERS TIÊU CHUẨN (ÁP DỤNG ALWAYS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # Cho phép upload tài liệu bài giảng tối đa 50MB
    client_max_body_size 50M;

    # Chuyển tiếp (Reverse Proxy) vào ứng dụng Web Node.js
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}