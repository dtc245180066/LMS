services:
  # ============================================================================
  # 1. DỊCH VỤ CƠ SỞ DỮ LIỆU MYSQL 8.0
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: lms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - dbnet

  # ============================================================================
  # 2. DỊCH VỤ WEB ỨNG DỤNG LMS (NODE.JS)
  # ============================================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: lms_app
    restart: always
    environment:
      PORT: ${PORT}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./app/public/uploads:/home/anlt/app/public/uploads
    networks:
      - webnet
      - dbnet
    depends_on:
      - db

  # ============================================================================
  # 3. DỊCH VỤ NGINX REVERSE PROXY & HTTPS
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - webnet
    depends_on:
      - app

  # ============================================================================
  # 4. DỊCH VỤ QUẢN TRỊ CSDL PHPMYADMIN
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lms_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - webnet
      - dbnet
    depends_on:
      - db

  # ============================================================================
  # 5. DỊCH VỤ THU THẬP METRICS MÁY CHỦ LINUX (NODE EXPORTER)
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: lms_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitor_net

  # ============================================================================
  # 6. DỊCH VỤ THU THẬP METRICS CONTAINERS (CADVISOR CỦA GOOGLE)
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: lms_cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - monitor_net

  # ============================================================================
  # 7. DỊCH VỤ THU THẬP METRICS MYSQL (MYSQL EXPORTER)
  # ============================================================================
  mysql_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: lms_mysql_exporter
    restart: always
    volumes:
      - ./prometheus/my.cnf:/.my.cnf:ro
    ports:
      - "9104:9104"
    networks:
      - dbnet
      - monitor_net
    depends_on:
      - db

  # ============================================================================
  # 8. BỘ NÃO TRUNG TÂM GIÁM SÁT PROMETHEUS
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: lms_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitor_net
      - webnet
    depends_on:
      - node_exporter
      - cadvisor
      - mysql_exporter

  # ============================================================================
  # 9. GIAO DIỆN TRỰC QUAN HÓA DASHBOARD GRAFANA
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: lms_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitor_net
    depends_on:
      - prometheus

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  webnet:
    driver: bridge
  dbnet:
    driver: bridge
    internal: true
  monitor_net:
    driver: bridge