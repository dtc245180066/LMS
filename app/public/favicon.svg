<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- NỀN SQUIRCLE BO GÓC HIỆN ĐẠI -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lmsGrad)"/>
  
  <!-- VIỀN NHẸ TINH TẾ -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- MŨ TỐT NGHIỆP / GRADUATION CAP BIỂU TƯỢNG HỌC TẬP UY TÍN -->
  <!-- Vành mũ trên (Diamond Mortarboard) -->
  <path d="M32 14 L53 23 L32 32 L11 23 Z" fill="#ffffff"/>
  
  <!-- Đáy mũ (Skull cap) -->
  <path d="M19 28.5 V39.5 C19 46 45 46 45 39.5 V28.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Dây tua rua mũ (Tassel) màu vàng ánh kim -->
  <path d="M50 24 V38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="40" r="2.2" fill="url(#goldGrad)"/>

  <!-- CHỮ LMS BOLD SẮC NÉT PHÍA DƯỚI -->
  <text x="32" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">LMS</text>
</svg>

